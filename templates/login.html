<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Restrito | A&C Governança SST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0A2540',
              royal: '#0077D4',
              sky: '#38BDF8',
              ice: '#F0F9FF'
            }
          }
        }
      }
    }
  </script>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-[#081B30] via-brand-navy to-[#081B30] min-h-screen flex items-center justify-center p-6 text-slate-800">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-white/10 space-y-6 relative overflow-hidden">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-brand-ice text-brand-royal mx-auto flex items-center justify-center shadow-inner">
        <i data-lucide="shield-check" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-black text-brand-navy tracking-tight">Console Administrativo</h1>
      <p class="text-xs text-slate-500">Acesso restrito para a gestão da A&C Governança</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="p-3 rounded-xl text-xs font-bold {% if category == 'sucesso' %}bg-emerald-50 text-emerald-700 border border-emerald-200{% else %}bg-rose-50 text-rose-700 border border-rose-200{% endif %}">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
      <div>
        <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Usuário</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
          <input type="text" name="usuario" required placeholder="admin" class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-royal">
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Senha de Acesso</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
          <input type="password" name="senha" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-royal">
        </div>
      </div>

      <button type="submit" class="w-full py-3 text-xs font-black uppercase tracking-wider text-white bg-brand-royal hover:bg-[#0066B8] rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
        <span>Autenticar e Entrar</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="/" class="text-xs text-slate-400 hover:text-brand-royal transition-colors">&larr; Voltar para a página pública</a>
    </div>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
